<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting</title>
</head>
<body>
    <!-- Text formatting tags-->

    <!-- bold tage used for make text bold-->
    <b>This is bold text</b> <br><br>

    <!-- strong text in text formatting which is similar to the bold-->
    <strong>This is strong text</strong><br><br>

    <!--italic text used to convert the text to italic-->
    <i>This is italic text</i><br><br>

    <!-- this em tags will convert it into emphasized text format-->
    <em> this is Emphasized text</em><br><br>

    <!--small tag is used to convert the text into smaller than normal text-->
    <small> This is small text</small>

    <!-- mark tag is used to highlet the text between a sentence-->
    <p>This is the <mark> mark tag </mark> in a sentence</p>
</body>
</html>
